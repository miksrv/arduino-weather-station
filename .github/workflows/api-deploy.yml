 name: API Deploy

 on:
   push:
     branches:
       - main
     paths:
       - 'server/**/*'
   # Manual run from the Actions tab or `gh workflow run api-deploy.yml`
   workflow_dispatch:

 # https://github.com/codeigniter4/CodeIgniter4/blob/develop/.github/workflows/deploy-apidocs.yml
 jobs:
   api-ssh-deploy:
     name: Production
     runs-on: ubuntu-latest
     timeout-minutes: 25

     steps:
       - uses: actions/checkout@v4

       # Docs: https://github.com/shivammathur/setup-php
       - name: Setup PHP
         uses: shivammathur/setup-php@v2
         with:
           php-version: 8.2
           extensions: mbstring, intl, curl, dom
           coverage: none

       - name: Get composer cache directory
         id: composer-cache
         run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
         working-directory: server

       - name: Cache composer dependencies
         uses: actions/cache@v4
         with:
           path: ${{ steps.composer-cache.outputs.dir }}
           key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
           restore-keys: ${{ runner.os }}-composer-

       - name: Install dependencies
         run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader
         working-directory: server

       - name: Install LFTP
         run: sudo apt install lftp

       - name: Configure LFTP
         run: mkdir ~/.lftp && echo "set ssl:verify-certificate false;" >> ~/.lftp/rc

       - name: Load Secrets
         run: echo "machine ${{ secrets.FTP_HOSTNAME }} login ${{ secrets.FTP_USERNAME }} password ${{ secrets.FTP_PASSWORD }}" > ~/.netrc

       # One lftp session (credentials from ~/.netrc above): each separate
       # `lftp -e` call re-connected and re-negotiated TLS, and `rm -r` deleted
       # app/ and vendor/ file by file before re-uploading everything.
       # `mirror --delete` keeps app/ and vendor/ in sync instead - files removed
       # from the repository are removed from the hosting too, with no window
       # where the code is missing. public/ and writable/ are never deleted
       # from: they hold user uploads and content.
       - name: Upload API
         run: |
           lftp ${{ secrets.FTP_HOSTNAME }} <<'EOF'
           set cmd:fail-exit yes
           set net:max-retries 3
           set net:timeout 30
           put -O / .htaccess
           put -O / env
           put -O / spark
           mirror -R --delete --parallel=10 app /app
           mirror -R --delete --parallel=10 vendor /vendor
           mirror -R --parallel=10 public /public
           mirror -R --parallel=10 writable /writable
           # Permissions are best effort, as before: never fail the deploy.
           set cmd:fail-exit no
           # New code may answer differently, while controllers keep responses in the file cache for up
           # to a day: the cache starts empty. Renamed (one call) instead of deleted file by file; the copy
           # left by the previous deploy is removed first. Before the chmods, so a failure here (no cache
           # yet) is not lftp's exit code
           glob -d rm -r /writable/cache.cleared-*
           mv /writable/cache /writable/cache.cleared-${{ github.run_id }}-${{ github.run_attempt }}
           mkdir /writable/cache
           put -O /writable/cache writable/cache/index.html
           chmod 755 /spark
           # The directories only, not -R: one FTP call per file, and the files are written by PHP itself
           chmod 755 /writable /writable/cache /writable/logs /writable/session /writable/uploads
           bye
           EOF
         working-directory: server
