# Optimized images (/_next/image): one copy per format, Next renders each size only once
proxy_cache_path /var/cache/nginx/meteo.miksoft.pro-images levels=1:2 keys_zone=METEO_IMAGES:10m max_size=32m inactive=30d use_temp_path=off;

# The format Next picks for /_next/image from the Accept header (images.formats: avif, webp)
map $http_accept $meteo_image_format {
    default         "";
    "~image/avif"   avif;
    "~image/webp"   webp;
}

# Upgrade only for websocket requests, so plain requests keep the upstream connection alive
map $http_upgrade $meteo_connection {
    default upgrade;
    ""      "";
}

upstream meteo_upstream {
  server 127.0.0.1:3007;
  keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name meteo.miksoft.pro www.meteo.miksoft.pro;

    server_tokens off;

    root /var/www/meteo.miksoft.pro;

    index index.html index.htm;

    client_max_body_size 64M;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    proxy_http_version 1.1;

    # Hashed build files straight from the disk: immutable, Node never sees them.
    # The deploy keeps the previous builds' files for a week, so old pages still load theirs
    location /_next/static/ {
        alias /var/www/meteo.miksoft.pro/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_cache            METEO_IMAGES;
        proxy_cache_key        $host$request_uri$meteo_image_format;
        proxy_ignore_headers   Cache-Control Expires Vary Set-Cookie;
        proxy_cache_valid      200 7d;
        proxy_cache_valid      any 1m;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        add_header             X-Image-Cache $upstream_cache_status;

        proxy_set_header       Host $host;
        proxy_set_header       Connection "";
        proxy_pass             http://meteo_upstream;
    }

    # For PM2 server NextJS application
    location / {
        proxy_pass             http://meteo_upstream;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;

        proxy_set_header       Host $host;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection $meteo_connection;
    }

    # location = /sitemap.xml {
    #     rewrite ^ /sitemap last;
    # }
}

# Wildcard DNS (*.meteo.miksoft.pro) points here too - canonicalize any
# other subdomain to the main domain instead of serving this app under it.
server {
    listen 80;
    listen [::]:80;

    server_name *.meteo.miksoft.pro;

    return 301 https://meteo.miksoft.pro$request_uri;
}

